services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shanye
      POSTGRES_USER: shanye
      POSTGRES_PASSWORD: shanye_dev_password
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shanye -d shanye"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://shanye:shanye_dev_password@db:5432/shanye
      LLM_PROVIDER: mock
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
