[project]
name = "shanye-shop-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "pydantic>=2.0", "uvicorn>=0.27", "sqlalchemy>=2.0", "langgraph>=0.2", "httpx>=0.27", "python-dotenv>=1.0", "psycopg[binary]>=3.2", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
